<header>
  <a class="brand" routerLink="/">+ Clínica Demo</a>
  <nav aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Servicios</a
    >
    @if (auth.hasRole('ROLE_USER')) {
      <a routerLink="/paciente" routerLinkActive="active">Mis citas</a>
    }
    @if (auth.hasRole('ROLE_ADMIN')) {
      <a routerLink="/admin" routerLinkActive="active">Administración</a>
    }
    @if (auth.session(); as session) {
      <span>{{ session.username }}</span
      ><button class="secondary" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Ingresar</a>
    }
  </nav>
</header>
<main><router-outlet /></main>
<footer>Proyecto académico · Spring Security + JWT · Datos de demostración</footer>
