spring.application.name=citas-medicas
spring.profiles.default=h2
server.port=8080
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

app.cors-origin=${CORS_ORIGIN:http://localhost:4200}
app.oauth2.issuer=${OAUTH2_ISSUER:http://localhost:8080}
app.jwt.issuer=${OAUTH2_ISSUER:http://localhost:8080}
app.demo-data=true

# Clave RSA local persistente. No incluir config/ en Git.
app.oauth2.key-file=${OAUTH2_KEY_FILE:./config/oauth2-key.json}
app.oauth2.service-secret=${OAUTH2_SERVICE_SECRET:secret123}
